server:
  port: 8088
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: tcmseek-agent-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AGENT_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/tcmseek?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
    username: ${AGENT_MYSQL_USERNAME:root}
    password: ${AGENT_MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${AGENT_MYSQL_POOL_SIZE:5}
      minimum-idle: ${AGENT_MYSQL_MIN_IDLE:1}
      connection-timeout: ${AGENT_MYSQL_CONNECT_TIMEOUT_MS:5000}
      initialization-fail-timeout: ${AGENT_MYSQL_INIT_FAIL_TIMEOUT:-1}
  data:
    redis:
      host: ${AGENT_REDIS_HOST:127.0.0.1}
      port: ${AGENT_REDIS_PORT:6379}
      database: ${AGENT_REDIS_DATABASE:0}
      password: ${AGENT_REDIS_PASSWORD:}
      timeout: ${AGENT_REDIS_TIMEOUT:5s}
  cloud:
    nacos:
      discovery:
        server-addr:
        namespace:
        group:
        enabled:
        register-enabled:
        metadata:
          version:
          service-name:
          framework:


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    com.tcmseek.ai: info
    com.tcmseek.ai.graph: debug
    org.springframework.ai: info

tcmseek:
  agent:
    postgres:
      driver-class-name: org.postgresql.Driver
      url: ${AGENT_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/tcmseek_ai}
      username: ${AGENT_POSTGRES_USERNAME:postgres}
      password: ${AGENT_POSTGRES_PASSWORD:}
      hikari:
        maximum-pool-size: ${AGENT_POSTGRES_POOL_SIZE:5}
        minimum-idle: ${AGENT_POSTGRES_MIN_IDLE:1}
        connection-timeout: ${AGENT_POSTGRES_CONNECT_TIMEOUT_MS:5000}
        initialization-fail-timeout: ${AGENT_POSTGRES_INIT_FAIL_TIMEOUT:-1}
    conversation:
      persistence-enabled: ${AGENT_CONVERSATION_PERSISTENCE_ENABLED:true}
      context-message-limit: ${AGENT_CONVERSATION_CONTEXT_MESSAGE_LIMIT:20}
      summary-enabled: ${AGENT_CONVERSATION_SUMMARY_ENABLED:true}
      summary-trigger-message-count: ${AGENT_CONVERSATION_SUMMARY_TRIGGER_MESSAGE_COUNT:12}
      summary-refresh-message-count: ${AGENT_CONVERSATION_SUMMARY_REFRESH_MESSAGE_COUNT:6}
      summary-source-message-limit: ${AGENT_CONVERSATION_SUMMARY_SOURCE_MESSAGE_LIMIT:40}
      memory-enabled: ${AGENT_CONVERSATION_MEMORY_ENABLED:true}
      memory-max-items: ${AGENT_CONVERSATION_MEMORY_MAX_ITEMS:5}
      memory-source-message-limit: ${AGENT_CONVERSATION_MEMORY_SOURCE_MESSAGE_LIMIT:20}
    cache:
      enabled: ${AGENT_REDIS_CACHE_ENABLED:true}
      key-prefix: ${AGENT_REDIS_KEY_PREFIX:agent}
      context-ttl: ${AGENT_REDIS_CONTEXT_TTL:2h}
      summary-ttl: ${AGENT_REDIS_SUMMARY_TTL:2h}
      memory-ttl: ${AGENT_REDIS_MEMORY_TTL:30m}
  llm:
    deepseek:
      api-key: ${AGENT_DEEPSEEK_API_KEY:not-configured}
      model-name: ${AGENT_DEEPSEEK_MODEL:deepseek-v4-flash}
      base-url: ${AGENT_DEEPSEEK_BASE_URL:https://api.deepseek.com}
    qwen:
      api-key: ${AGENT_QWEN_API_KEY:not-configured}
      model-name: ${AGENT_QWEN_MODEL:qwen3.7-max}
      base-url: ${AGENT_QWEN_BASE_URL:https://llm-cb8m35te86kmvufg.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
  neo4j:
    uri: neo4j://192.168.245.128/:7688
    username: neo4j
    password: 12345678
